# Two ways to run it:
#
#   docker compose up -d                   Agentry alone, published on 127.0.0.1 only (the default)
#   docker compose --profile tls up -d     the same, plus a TLS-terminating proxy on :80 and :443
#
# The tls profile is for reaching Agentry from another machine. Turn on authentication first
# (AGENTRY_AUTH_MODE=token and AGENTRY_AUTH_TOKEN in .env): the proxy encrypts, it does not
# authenticate. docs/deploy.md has the details, including the headers the proxy passes.
services:
  agentry:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Listed without a value so that, unless you set it in .env, the Dockerfile's pinned
        # version wins instead of being overridden by a default written here as well
        - CLAUDE_CODE_VERSION
        - CODEX_VERSION
        - GEMINI_CLI_VERSION
        - COPILOT_VERSION
        - OPENCODE_VERSION
        - YOUTRACK_APP_VERSION
        # A gh or glab bump needs its digest too: the build checks the download against it
        - GH_VERSION
        - GH_SHA256
        - GLAB_VERSION
        - GLAB_SHA256
        - TAILSCALE_VERSION
        - TAILSCALE_SHA256
    image: agentry:dev
    init: true # reaps the claude child processes
    env_file: .env
    ports:
      # localhost only: put authentication (and, off this machine, TLS) in front before changing it
      - "127.0.0.1:${PORT:-8787}:8787"
    # The three folders the image declares as volumes, all named here. Compose prefixes a volume's
    # name with the project's, which is the folder's name unless COMPOSE_PROJECT_NAME says otherwise:
    # started from another folder it would find three empty ones. Set COMPOSE_PROJECT_NAME in .env
    # once and the data follows the name, not the folder (docs/deploy.md).
    volumes:
      - claude-config:/home/node/.claude # account config: settings, MCP servers, CLAUDE.md, sessions
      - wrapper-data:/data # wrapper state: SQLite store, provider settings, credential, uploads, the other agents', gh's and glab's sign-ins, the Tailscale node of Remote access
      - ./workspace:/workspace # projects Claude works on
    # The image's healthcheck ends the server after three failed probes and this policy starts it
    # again: Docker itself never restarts an unhealthy container, only one that exited
    restart: unless-stopped
    # Time for SIGTERM to stop the chats and close the store before Docker sends SIGKILL
    stop_grace_period: 30s

  proxy:
    profiles: [tls]
    image: caddy:2-alpine
    # Caddy's own certificates are stored below: an ACME-issued one is rate limited, so losing it on
    # every recreate would eventually lock you out of a renewal
    environment:
      # A public name gets a Let's Encrypt certificate; `localhost` gets one from Caddy's local CA
      AGENTRY_DOMAIN: ${AGENTRY_DOMAIN:-localhost}
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy-data:/data
      - proxy-config:/config
    depends_on:
      agentry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  claude-config:
  wrapper-data:
  proxy-data:
  proxy-config:
