{{- if and (eq .Values.auth.mode "token") (not .Values.auth.token.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentry.tokenSecret" . }}
  labels:
    {{- include "agentry.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.token.key }}: {{ .Values.auth.token.value | quote }}
{{- end }}
