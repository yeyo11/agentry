name: CI

# Pull requests only, plus a daily run on main. GitHub tests a pull request as it would land (the
# merge of the branch into main), and main is protected on `test`, so re-running the same tree after
# the squash-merge told us nothing: over the last 120 runs it burned 84 minutes and 23 of those 56
# main runs were cancelled mid-flight by the next merge anyway. It never gated anything either — the
# release workflow's `edge` image build starts on the same push, in parallel, not behind CI.
# The daily run is the safety net a post-merge run used to pretend to be: main can be merged into
# while stale (protection is not `strict`), so a semantic conflict between two pull requests is
# caught within a day, and the README badge keeps reporting the default branch.
on:
  pull_request:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# release-please pull requests only bump versions and rewrite the changelog: worth typechecking and
# building, not worth booting Chrome and a container for. They are the second half of every release,
# so this is one of these skips per release, not per week.
env:
  GENERATED_RELEASE_PR: ${{ startsWith(github.head_ref, 'release-please--') }}

jobs:
  # Which jobs a change needs. A pull request that touches only documentation (docs/, or Markdown
  # anywhere) cannot change what the browser sees, so it skips the e2e shards and still gets its
  # `test` check; the checks job runs anyway, since tests read the README and the docs. Anything
  # that is not a pull request (the daily run, a manual one) runs everything, and release-please
  # pull requests skip the e2e shards as they always have.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.decide.outputs.e2e }}
    steps:
      # A pull request is checked out as its merge into main: the first parent is main, so the diff
      # against it is exactly what the pull request changes, and two commits of history suffice
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$GENERATED_RELEASE_PR" = true ]; then
            echo "release-please pull request: no e2e"
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" != pull_request ]; then
            echo "$EVENT: everything runs"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            # No history to compare with (it should not happen) runs everything rather than nothing
            files=$(git diff --name-only HEAD^1 HEAD || true)
            printf 'changed:\n%s\n' "$files"
            code=$(printf '%s\n' "$files" | grep -vE '^docs/|\.md$' | grep -v '^$' || true)
            if [ -n "$files" ] && [ -z "$code" ]; then
              echo "documentation only: no e2e"
              echo "e2e=false" >> "$GITHUB_OUTPUT"
            else
              echo "e2e=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  checks:
    runs-on: ubuntu-latest
    # Install, audit, typecheck, the unit tests, a build and the harness's own test take 5 to 7.5
    # minutes, of which `pnpm test` is 2.6 to 3.9 (main runs 37197153734 and 37459090109, 2026-10-06).
    # About 2.5x the slowest, rounded up to 5 minutes, so a slow runner does not fail a run that was
    # going to pass. A test that hangs fails on its own long before: every package's runner has a
    # per-test timeout and forces its exit (CW-27)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A new high-severity advisory against a dependency fails the next pull request, including one
      # that did not cause it. That is the trade: the daily run on main puts a ceiling of a day on
      # how long the tree can carry one, instead of it waiting for somebody to run an audit by hand.
      - name: No high-severity advisories in the dependency tree
        run: pnpm audit --audit-level=high

      - name: OpenAPI schemas are up to date with the shared types
        run: |
          pnpm --filter @agentry/api openapi:schemas
          git diff --exit-code -- apps/api/src/openapi/schemas.json

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # The e2e runner's own tests: the split without a browser, then the real runner over probe
      # specs (limits, signals, shards, no survivors). They sit here rather than in a shard because
      # this job has minutes to spare while the shards are the ones everybody waits for
      - name: The e2e runner and its shards
        run: node --test e2e/shards.test.mjs e2e/harness.test.mjs

  # The e2e suite, cut into 4 shards that run side by side (e2e/shards.mjs balances them over
  # e2e/timings.json, at about 4.5 of the suite's 17-18 minutes each). 4 is where a shard's suite
  # stops being the longest part of the job: install, build and the CLI take about 2 minutes of it.
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # About 6.5 minutes a shard (2 to set up, 4.5 of specs). About 2.5x that, rounded up to 5 minutes
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The e2e suite needs the CLI binary (plugins, MCP) but no login: it runs on empty temp dirs.
      # The installer is checked against the digest the Dockerfile pins rather than a second copy of
      # it, so rotating the pin is one edit and the two can never disagree about which script is
      # trusted. The `docker` job builds the same pinned step, so this adds no new way to fail.
      - name: Install Claude Code
        run: |
          sha=$(sed -n 's/^ARG CLAUDE_CODE_INSTALLER_SHA256=//p' docker/Dockerfile)
          test -n "$sha"
          curl -fsSL -o /tmp/claude-install.sh https://claude.ai/install.sh
          echo "$sha  /tmp/claude-install.sh" | sha256sum -c -
          bash /tmp/claude-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: End-to-end (headless Chrome), shard ${{ matrix.shard }} of 4
        run: pnpm e2e
        env:
          E2E_SHARD: ${{ matrix.shard }}/4
          E2E_SHOTS: e2e-shots

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-screenshots-${{ matrix.shard }}
          path: e2e-shots

  # The one check main is protected on. It stands for the jobs above: the checks passed, and the e2e
  # shards passed, or were skipped because the change did not need them. Named `test` so branch
  # protection needs no change; it runs even when a job it needs failed, so it reports the failure
  # instead of being skipped (a skipped required check would let a pull request merge).
  test:
    needs: [changes, checks, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checks passed, and the e2e shards passed or were not needed
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECKS: ${{ needs.checks.result }}
          E2E: ${{ needs.e2e.result }}
          WANTED: ${{ needs.changes.outputs.e2e }}
        run: |
          echo "changes: $CHANGES, checks: $CHECKS, e2e: $E2E (needed: $WANTED)"
          test "$CHANGES" = success
          test "$CHECKS" = success
          if [ "$WANTED" = true ]; then test "$E2E" = success; else test "$E2E" = skipped; fi

  docker:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    # About 3x the slowest successful run (1.4 min over 76), rounded up to 5 minutes
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -f docker/Dockerfile -t agentry:ci .
      - name: Container reports a detected CLI
        run: |
          docker run -d --name agentry --init -p 8787:8787 agentry:ci
          for i in $(seq 1 30); do curl -fsS localhost:8787/api/system && break; sleep 1; done
          curl -fsS localhost:8787/api/system | grep -q '"installed":true'
          curl -fsS -o /dev/null localhost:8787/docs/
