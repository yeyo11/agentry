name: Image

# Reusable: both the push-to-main build and the release build go through here, so the two never
# drift apart. It is called, never triggered — a tag pushed by GITHUB_TOKEN does not start a
# workflow of its own, which is exactly the trap this avoids.
#
# amd64 only. arm64 was built under QEMU, which made a release image cost 6 minutes instead of 2
# and, on 0.11.1, hung for 93 minutes inside a `vite build` that normally takes 3 seconds.
on:
  workflow_call:
    inputs:
      tags:
        description: Newline-separated docker/metadata-action tag expressions
        required: true
        type: string
      ref:
        description: Commit or tag to build
        required: false
        default: ''
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    # About 3x the slowest successful run (2.2 min over 32), rounded up to 5 minutes. A release that
    # runs long blocks the queue behind it; failing fast leaves a draft to rebuild with the release
    # workflow's `tag` input.
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: ${{ inputs.tags }}
          labels: |
            org.opencontainers.image.title=Agentry
            org.opencontainers.image.description=Run Claude Code as a service: REST API, web UI and multi-agent orchestration in one container
            org.opencontainers.image.licenses=MIT

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
