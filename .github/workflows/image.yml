name: Image

# Reusable: both the push-to-main build and the release build go through here, so the two never
# drift apart. It is called, never triggered — a tag pushed by GITHUB_TOKEN does not start a
# workflow of its own, which is exactly the trap this avoids.
on:
  workflow_call:
    inputs:
      tags:
        description: Newline-separated docker/metadata-action tag expressions
        required: true
        type: string
      platforms:
        description: Build platforms; arm64 is emulated and slow, so only releases pay for it
        required: false
        default: linux/amd64
        type: string
      ref:
        description: Commit or tag to build
        required: false
        default: ''
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: docker/setup-qemu-action@v3
        if: contains(inputs.platforms, 'arm64')

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: ${{ inputs.tags }}
          labels: |
            org.opencontainers.image.title=Agentry
            org.opencontainers.image.description=Run Claude Code as a service: REST API, web UI and multi-agent orchestration in one container
            org.opencontainers.image.licenses=MIT

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
