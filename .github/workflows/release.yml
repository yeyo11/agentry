name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Keeps a release pull request open, with the changelog and every version already bumped.
  # Merging it tags the commit and publishes the GitHub release.
  please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Between releases, main publishes `edge` only: `latest` belongs to the newest release.
  edge:
    needs: please
    if: needs.please.outputs.released != 'true'
    uses: ./.github/workflows/image.yml
    with:
      tags: |
        type=edge,branch=main
        type=sha,format=short

  # A release just landed: build it for arm64 as well and move `latest` onto it.
  release:
    needs: please
    if: needs.please.outputs.released == 'true'
    uses: ./.github/workflows/image.yml
    with:
      ref: ${{ needs.please.outputs.tag }}
      platforms: linux/amd64,linux/arm64
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
        type=raw,value=latest
