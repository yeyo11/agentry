name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Rebuild an existing release tag (e.g. v0.4.0) instead of running release-please; its packages can only be replaced while it is a draft
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # Keeps a release pull request open, with the changelog and every version already bumped.
  # Merging it tags the commit and creates the GitHub release as a draft: releases are immutable once
  # published, so the packages are attached first and `publish` makes it public at the end. The tag is
  # created right away (`force-tag-creation`), since a draft has none and the next release needs it.
  please:
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # GitHub does not trigger workflows on pushes made with GITHUB_TOKEN, so a release PR opened with it
      # never runs CI. An app token makes the release PR run CI like any other pull request.
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Between releases, main publishes `edge` only: `latest` belongs to the newest release.
  edge:
    needs: please
    if: inputs.tag == '' && needs.please.outputs.released != 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image.yml
    with:
      tags: |
        type=edge,branch=main
        type=sha,format=short

  # A release just landed, or one is being republished by hand: build it for arm64 as well and move
  # `latest` onto it. The version is passed as `value` because metadata-action otherwise reads it
  # from the triggering event — a push to main, which carries no tag — and silently publishes none.
  release:
    needs: please
    if: always() && (inputs.tag != '' || needs.please.outputs.released == 'true')
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image.yml
    with:
      ref: ${{ inputs.tag || needs.please.outputs.tag }}
      platforms: linux/amd64,linux/arm64
      tags: |
        type=semver,pattern={{version}},value=${{ inputs.tag || needs.please.outputs.tag }}
        type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || needs.please.outputs.tag }}
        type=semver,pattern={{major}},value=${{ inputs.tag || needs.please.outputs.tag }}
        type=raw,value=latest

  # The Linux desktop app rides the same trigger as the image: AppImage and .deb are attached to the draft
  # release that was just created.
  desktop:
    needs: please
    if: always() && (inputs.tag != '' || needs.please.outputs.released == 'true')
    permissions:
      contents: write
    uses: ./.github/workflows/desktop.yml
    with:
      tag: ${{ inputs.tag || needs.please.outputs.tag }}

  # Last step of a release: the draft goes public, and immutable, only once the image is pushed and the
  # packages are on it. A failure before this leaves a draft to fix and publish, never a public release
  # missing its files.
  publish:
    needs: [please, release, desktop]
    if: always() && (inputs.tag != '' || needs.please.outputs.released == 'true') && needs.release.result == 'success' && needs.desktop.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        run: |
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "true" ]; then
            gh release edit "$TAG" --draft=false --latest
          else
            echo "$TAG is already published"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || needs.please.outputs.tag }}
