name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Rebuild and publish an existing release tag (e.g. v0.4.0) instead of running release-please
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # Keeps a release pull request open, with the changelog and every version already bumped.
  # Merging it tags the commit and publishes the GitHub release.
  please:
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Between releases, main publishes `edge` only: `latest` belongs to the newest release.
  edge:
    needs: please
    if: inputs.tag == '' && needs.please.outputs.released != 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image.yml
    with:
      tags: |
        type=edge,branch=main
        type=sha,format=short

  # A release just landed, or one is being republished by hand: build it for arm64 as well and move
  # `latest` onto it. The version is passed as `value` because metadata-action otherwise reads it
  # from the triggering event — a push to main, which carries no tag — and silently publishes none.
  release:
    needs: please
    if: always() && (inputs.tag != '' || needs.please.outputs.released == 'true')
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image.yml
    with:
      ref: ${{ inputs.tag || needs.please.outputs.tag }}
      platforms: linux/amd64,linux/arm64
      tags: |
        type=semver,pattern={{version}},value=${{ inputs.tag || needs.please.outputs.tag }}
        type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || needs.please.outputs.tag }}
        type=semver,pattern={{major}},value=${{ inputs.tag || needs.please.outputs.tag }}
        type=raw,value=latest

  # The Linux desktop app rides the same trigger as the image: AppImage and .deb are attached to the release
  # that was just published, or replaced on it when a tag is republished by hand.
  desktop:
    needs: please
    if: always() && (inputs.tag != '' || needs.please.outputs.released == 'true')
    permissions:
      contents: write
    uses: ./.github/workflows/desktop.yml
    with:
      tag: ${{ inputs.tag || needs.please.outputs.tag }}
